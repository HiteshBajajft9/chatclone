services:
  # Backend Service - Express.js API
  - type: web
    name: chatbook-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/auth
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGO_URL
        sync: false # Set this manually in the Render dashboard with your MongoDB connection string

  # Frontend Service - React + Vite Static Site
  - type: web
    name: chat-app-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist